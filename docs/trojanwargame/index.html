<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
  <title>Overview — Felix Dawson</title>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <link rel="stylesheet" type="text/css" href="/styles/layout.css" />
  <link rel="stylesheet" type="text/css" href="/styles/styles.css" />
  <link rel="shortcut icon" href="/images/icon.png" />
  <script src="/scripts/utils.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>
<div id="footer-placeholder"></div>
<script>
  fetch('/includes/nav.html')
    .then(r => r.text())
    .then(html => {
      injectHTML(document.getElementById('nav-placeholder'), html);
      document.getElementById('rightSidebar').style.display = 'none';
      return fetch('/includes/tabs.html');
    })
    .then(r => r.text())
    .then(tabsHtml => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(tabsHtml, 'text/html');
      doc.querySelectorAll('.tab').forEach(function(tab) {
        if (tab.getAttribute('href') === window.location.pathname) {
          tab.classList.add('active');
        }
      });
      const activatedTabsHtml = doc.body.innerHTML;

      document.getElementById('rightCol').innerHTML = activatedTabsHtml + `
        <p><span class="PageHeading">Sample heading</span></p>
        <hr class="PageDivider">
        <p>Body text.</p>
      `;
    });

  fetch('/includes/footer.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
      document.getElementById('year').textContent = new Date().getFullYear();
    });
</script>
</body>
</html>
