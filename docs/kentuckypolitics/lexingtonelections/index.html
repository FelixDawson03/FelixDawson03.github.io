        <p><span class="PageHeading">Lexington Election Results</span></p>
        <p class="PageSubtitle">Published June 24, 2026</p>
        <hr class="PageDivider">
        <p>This page lists official Lexington election returns—namely, results for mayoral elections (1931 to present) and elections for County Judge (1929 to 1973). In 1972, voters in Fayette County approved a merger of their government with the city of Lexington; below I describe the resulting changes to the electoral process during this period.</p>
        <p>The Mayor of Lexington, which is now coterminous with Fayette County, is chosen in nonpartisan elections for a four-year term. The mayor was originally elected in the year preceding a presidential election; the charter of the merged city-county government moved the election date to the year after a presidential election, beginning in 1973. A state constitutional amendment in 1992 moved all municipal elections to even-numbered years; the mayor was subsequently elected to a five-year term in 1993 in order to move future elections to midterm years.</p>
        <p>Prior to the city-county merger, the chief executive of the county government was the County Judge, who was chosen in partisan elections for a four-year term. The merger deprived the County Judge of their executive authority, which was given to the mayor effective with the 1973 elections. Furthermore, a 1975 state constitutional amendment removed the office's remaining judicial power, making the Fayette County Judge a mostly symbolic figurehead after the 1977 elections. For this reason I have excluded the election results for County Judge beginning in that year.</p>
        <p>In mayoral elections, a primary election is only held if more than two candidates have filed, with the primary then limiting the field to the top two. In County Judge elections, a partisan primary is only held if two or more candidates have filed for a party's nomination; there were no Republican primaries during this period.</p>
        <p>The Mayor of Lexington was originally limited to one consecutive term. The charter of the merged government increased this to two consecutive terms, which was increased again to three terms in 1987 by an amendment to the charter. The County Judge is not subject to term limits.</p>
        <p>These results were accessed at the archives of the Fayette County Clerk. The rules for write-in candidates, and under what circumstances a write-in vote was counted, appear to have been followed inconsistently across different elections. I have nonetheless reported the write-in totals in each election verbatim as they appeared in the archives.</p>
