  <style>
    .city-table-wrap { overflow-x: auto; margin-top: 1em; }
    table.city-table { border-collapse: collapse; width: 100%; font-size: 0.9em; }
    table.city-table th,
    table.city-table td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    table.city-table th { background: #eee; position: sticky; top: 0; }
    table.city-table tbody tr:nth-child(even) { background: #f8f8f8; }

<body>
<div id="nav-placeholder"></div>
<div id="footer-placeholder"></div>
<script>
  function renderCityTable(rows) {
    var container = document.getElementById('cityTable');
    if (!container) return;
    if (!rows.length) { container.textContent = 'No data.'; return; }
    var esc = function (s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    var keys = Object.keys(rows[0]);
    var html = '<table class="city-table"><thead><tr>' +
      keys.map(function (k) { return '<th>' + esc(k) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr>' + keys.map(function (k) {
          return '<td>' + esc(r[k]) + '</td>';
        }).join('') + '</tr>';
      }).join('') +
      '</tbody></table>';
    container.innerHTML = html;
  }

  fetch('/includes/nav.html')
    .then(r => r.text())
    .then(html => {
      injectHTML(document.getElementById('nav-placeholder'), html);
      document.getElementById('rightCol').innerHTML = `
        <p><span class="PageHeading">Sample heading</span></p>
        <hr class="PageDivider">
        <p>Below is a table listing each incorporated city in Kentucky and its form of government. Although similar lists exist on Wikipedia (<a href="https://en.wikipedia.org/wiki/List_of_cities_in_Kentucky">here</a>) and the Kentucky Secretary of State’s website (<a href="https://web.sos.ky.gov/land/citiesprebuiltlists.aspx">here</a>), I felt the need to create a more definitive list that both (1) includes all pertinent information in one place convenient to the researcher, and (2) addresses the various errors present in both lists. The Secretary of State’s list seemingly has not been updated since 2015 and therefore in its current state has an error rate of about ten percent. The Wikipedia list suffers in this regard too in that it is based on the Secretary of State’s list; the result of this is that both lists contain cities that no longer exist, and there is really no way that I could correct the Wikipedia list without violating Wikipedia’s prohibition on original research.</p>

<h3>Background and general rules</h3>

<p>Prior to 2015, cities in Kentucky were divided into six classes on the basis of population. In 2014, the six-class system was abolished by law and replaced by a simpler one effective January 1, 2015: Louisville was designated the only city of the first class, while every other city became “home rule” class. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=48681">81.005</a>. This history is only relevant to the present list insofar as relics of the former system remain in two places. The first is that cities that were elevated to the second class before 1980 (seven total) elect their mayors in presidential years—two years after every other city in the state (e.g. 2024 and 2028, instead of 2022 and 2026). This is because the statute requiring this staggering (KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=25224">84.350</a>) was repealed in 1980; every city that was elevated after 1980 continued electing its mayor in midterm years. The second relic of the class system is the state constitution’s requirement that mayors in cities of the first and second class be limited to three consecutive terms. Ky. Const. § <a href="https://apps.legislature.ky.gov/Law/Constitution/Constitution/ViewConstitution?rsn=186">160</a>. The General Assembly has specified that this should be construed as applying to all cities that were second class as of August 1, 2014 (12 total). KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=43596">83A.024</a>. The remaining mayors in the state have no term limit. None of these provisions apply to Lexington, which is a special case discussed below.</p>

<p>All cities must have a mayor elected to a four-year term and a legislative body elected to a two-year term. Ky. Const. § <a href="https://apps.legislature.ky.gov/Law/Constitution/Constitution/ViewConstitution?rsn=186">160</a>. All general elections must be held in even-numbered years on the November election day. Ky. Const. § <a href="https://apps.legislature.ky.gov/Law/Constitution/Constitution/ViewConstitution?rsn=193">167</a>. All primary elections, if the city has them, must be held with the state primary on the first Tuesday after the third Monday in May (this ranges from May 16 to 22). KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=25166">83A.043</a>(2), <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=51687">118.025</a>(3).</p>

<h3>Choices for cities: form of government</h3>

<p>The following is a modified explainer from the Kentucky League of Cities.</p>

<p>City governments in Kentucky operate under one of three models: mayor-council, commission, or city manager. Although the mayor-council form is the most prevalent, each form has specific advantages for different needs facing cities.</p>

<p><strong>Mayor-Council</strong> (KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=25182">83A.130</a>). The mayor-council plan operates much like any executive-legislative form of government. The council, as the legislative body, performs legislative duties such as enacting ordinances, levying taxes, and adopting a budget. The mayor holds executive powers such as vetoing legislation, overseeing personnel, and managing the daily affairs of the city. The mayor presides at council meetings but may only vote to break a tie, unless such a tie-breaking vote is prohibited by a specific statute. City councils are required to have between six and twelve council members. A mayor’s veto may be overridden by a supermajority of a majority of the entire membership plus one.</p>

<p><strong>Commission</strong> (KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=25183">83A.140</a>). The commission plan consists of a mayor and four elected city commissioners who together comprise the city commission. The members of this commission share legislative, executive, and administrative authority in the city. Thus, the commission plan does not have the strict separation of powers of the mayor-council plan. The mayor acts as a voting member of the commission, with only limited responsibilities and authorities as mayor, such as presiding at commission meetings and executing contracts. Although the ultimate authority is vested in the city commission as a body, state law requires that administrative functions of the city be separated into departments by ordinance. Each of these departments is placed under the supervision of one of the city commissioners, unless the commission has created the office of city administrative officer. The commission as a whole is free to override any action taken by a commissioner overseeing a department.</p>

<p><strong>City Manager</strong> (KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=52572">83A.150</a>). The city manager plan is similar to the commission plan in that it provides for a mayor and four commissioners who together comprise the board of commissioners. The distinction is that significant administrative powers are vested in the city manager, a position the board of commissioners must establish. The manager is appointed to serve an indefinite term by a majority vote of the board and is responsible for the supervision of all departments of city government and the conduct of city employees. As in the commission plan, the mayor is a fully functioning member of the board of commissioners with only a limited role as mayor.</p>

<p>Additionally, Louisville, as the state’s only city of the first class, was until 2002 governed by the mayor-alderman plan. <em>See</em> KRS <a href="https://apps.legislature.ky.gov/law/statutes/chapter.aspx?id=37459">Chapter 83</a>. The plan was designed specifically for Louisville and was only ever used by it. Current law allows any city with the largest population located in a county with a population greater than 250,000 to use the currently dormant plan. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=43593">83A.160</a>(6). However, the only cities that meet these requirements are Louisville and Lexington.</p>

<h3>Choices for cities: elections</h3>

<p>Cities may decide whether their elections are partisan or nonpartisan. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53991">83A.045</a>. However, partisan cities are exceedingly rare (only four of 406 home rule cities). Cities with partisan elections are required to hold a primary, in which each party’s voters nominate as many candidates as there are seats to be elected. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53991">83A.045</a>(1)(a) (the rule requiring the number of candidates to be nominated is not explicitly stated in the statute). Cities with nonpartisan elections may choose whether a primary is held or waived. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53991">83A.045</a>(2)(b). A nonpartisan primary reduces the slate of candidates to twice the number that are to be elected, and is only held if the field of candidates exceeds twice the number of seats. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=57011">83A.170</a>(6, 13). Waiving the primaries for mayor and the city legislative body is not severable. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53991">83A.045</a>(2)(b) (implied). Waiving a nonpartisan primary has proven popular (86.3% of nonpartisan cities), though the odds of a city not waiving its primary increase with its population. Small cities (with, say, a city commission) have found little use for a primary that may reduce the field of candidates from nine to eight.</p>

<p>By default, members of a city legislative body are elected by citywide plurality block voting. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=58058">83A.040</a>(4). However, a city may be divided into wards, in which case there is a separate single-winner election held for the legislator from each ward. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53992">83A.100</a>(4)(a). A voter may vote for a candidate in every ward regardless of their place of residence, but candidates for office must reside in their ward. <em>Id.</em> Additionally, a city may choose to use a hybrid-ward system where a portion of the city legislative body is elected by ward and a portion at-large (no cities currently use this system). KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53992">83A.100</a>(1)(b). Three cities are currently divided into wards: Hopkinsville, which is partisan; and Madisonville and Somerset, which are nonpartisan. Nonpartisan primary elections for cities with wards, if a city has not waived them, vary in that a city may choose whether the nominees are chosen by the city at-large or by only the voters residing in the ward. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53992">83A.100</a>(4)(d). Madisonville limits the primary electorate to ward residents, while Somerset conducts ward primaries at-large. In partisan cities, the primary electorate must be only the residents of each ward. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53992">83A.100</a>(4)(b).</p>

<p>The first Friday following the first Monday in January is the filing deadline for (1) candidates in nonpartisan cities with primaries, and (2) major-party candidates in partisan cities. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53991">83A.045</a>(2)(a), (1)(a). The first Tuesday after the first Monday in June is the filing deadline for (1) candidates in nonpartisan cities without primaries, and (2) independent and third-party candidates in partisan cities. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53991">83A.045</a>(2)(b), (1)(b).</p>

<h3>Louisville</h3>

<p>Louisville, as the only city of the first class, was historically governed by the mayor-alderman plan. <em>See</em> KRS <a href="https://apps.legislature.ky.gov/law/statutes/chapter.aspx?id=37459">Chapter 83</a>. However, in 2000, Jefferson County voters approved a plan to merge the governments of Jefferson County and Louisville under a “consolidated local government”. In effect, this abolished the former governments of the county and city and created a <em>sui generis</em> entity that, by law, is neither a county nor city but may exercise the privileges of either. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=24002">67C.101</a>(2)(d). This “metro government” is coterminous with the entirety of Jefferson County; this includes joint jurisdiction with the 81 home rule class cities in the county, whose residents may vote in both metro and city elections. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=57995">67C.111</a>(1).</p>

<p>State law provides for a 26-member legislative council elected from single-member districts in nonpartisan elections. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=57991">67C.103</a>. The terms are staggered such that half of the council is elected every two years. <em>Id.</em> There are no term limits for councilors. The mayor is chosen by nonpartisan election to a four-year term. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=55789">67C.105</a>(2). The state constitution establishes a three-term limit for a mayor of a city of the first class, but in 2022 the General Assembly established a two-term limit for the metro mayor. <em>Id.</em>, Ky. Const. § <a href="https://apps.legislature.ky.gov/Law/Constitution/Constitution/ViewConstitution?rsn=186">160</a>. The constitutionality of this recent law has not yet been tested. A mayor’s veto may be overridden by a two-thirds vote of the council. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=57991">67C.103</a>(13).</p>

<p>All elections are held in even-numbered years, with mayoral elections in midterm years.</p>

<h3>Lexington</h3>

<p>Kentucky law allows for the merging of the governments of a county and city into an “urban-county government”, in which case the city/county is given wide leeway to create its own structure of government by charter. KRS <a href="https://apps.legislature.ky.gov/law/statutes/chapter.aspx?id=37378">67A</a>.010-020. Since the statute was created in 1970, Lexington has been the only city to successfully adopt a merged government; its merger with Fayette County was approved by voters in 1972.</p>

<p>The <a href="https://library.municode.com/ky/lexington-fayette_urban/codes/code_of_ordinances?nodeId=vvi3cqxPk3">Lexington-Fayette Charter</a> provides for a 15-member Urban County Council (“council”) composed of three councilors elected by the city at-large to four-year terms and twelve councilors elected from single-member districts to two-year terms. Lexington-Fayette Charter §§ 4.01, 4.04. At-large councilors are limited to three consecutive terms, and district councilors are limited to six consecutive terms; both of these limits total twelve years. Charter § 4.04. Because these limits are separate, a councilor is free to alternate between district and at-large seats in perpetuity whenever the twelve-year clock runs out. Alternatively, they could sit out a term and then return.</p>

<p>The charter provides for a mayor who is elected by the city at-large to a four-year term. Charter § 5.02. The mayor presides at council meetings but may only vote to break a tie. Charter § 5.04. The mayor is limited to three consecutive terms. Charter § 5.02. The mayor can veto most ordinances but a veto may be overridden by a three-fifths vote of the council. Charter § 5.05. The at-large councilor who received the most votes in the previous election is vice-mayor for their term. Charter § 4.07. The vice-mayor presides in the absence of the mayor, and becomes mayor when a vacancy occurs in the office. Charter §§ 4.07, 5.06. The new mayor would then serve the remainder of the former mayor’s term; however, if there is more than two years remaining on the term, they would only serve until a special election is held for the office. Charter § 5.06.</p>

<p>Elections for mayor and council are both nonpartisan. Charter §§ 4.04, 5.02. All elections are held in even-numbered years, with elections for mayor and council at-large in midterm years.</p>

<h3>Methodology</h3>

<p>I determined each city’s form of government by examining the sample ballots for 2026. If a city elected a “city council” with 6 to 12 members, it was deemed to use the mayor-council plan. If a city elected four “city commissioners”, then it was deemed to use either the commission or city manager plan. In order to determine which was which, I relied on the Secretary of State list as a starting point but verified each city under the city manager plan by finding the name of their current manager. I also verified that some of the more populous commission cities did not currently have a city manager.</p>

<p>In order to determine whether a city waives its primary, I looked at the dates each candidate for office filed their statement of candidacy. Because the deadline in 2026 in cities that have a primary was January 9th, any city in which a candidate filed after this date can be assumed to waive its primary. In cities where every candidate filed on or before January 9th, I assumed that all held primaries. These assumptions were checked against the Kentucky Registry of Election Finance’s candidate filings that are categorized based on whether a city waives its primary; this check yielded no discrepancies with my initial assumptions.</p>

<p>Seven of what I term “problem cities” are holding elections in 2026 for a “city council” with fewer than six members. This is impossible given the aforementioned requirement that a council elect six to twelve members. After researching what is happening in these cities, I have come to the conclusion that each is likely governed by a city commission but nonetheless uses the incorrect label “city council”. Two facts of law support this conclusion. The first is that in 1980 the General Assembly mandated that every city of the sixth class would be governed by a commission; all of these cities were sixth-class at the time. The second fact is that a change in a city’s form of government is only permitted by popular vote. KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=43593">83A.160</a>(1). Since 1980, each of these problem cities has elected four city legislators, regardless of whatever term was used to describe them. In most cases, they were initially called “commissioners” before the county clerk began mislabeling the ballots for “city council”. Because no vote has been held in these cities regarding a change in government, and because they have continued to elect four legislators since 1980, I believe they are governed by commissions as a matter of law regardless of whatever term is used to describe themselves.</p>

<p>Two of the problem cities, Bremen and South Carrollton, unilaterally increased the size of their “city council” (from 4 to 5, and 4 to 6, respectively) between the 2016 and 2018 elections without a referendum on their form of government. I believe these cities, properly governed by four-member commissions, are improper twice over—both in their terminology and in their number of members. The situation in South Carrollton, where a gentleman’s agreement exists under which no candidates run so that the council can appoint themselves to the resulting vacancies, could be an entire article unto itself. (This is improper for several reasons, not the least of which is that Kentucky law does not allow prospective appointment of city legislators). KRS <a href="https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=58058">83A.040</a>(5) (implied).</p>
        <div id="cityTable" class="city-table-wrap">Loading…</div>
      `;
      fetch('/includes/citylist.json')
        .then(r => r.json())
        .then(renderCityTable)
        .catch(() => {
          document.getElementById('cityTable').textContent = 'Could not load city list.';
        });
      return fetch('/includes/rightSidebar.html');
    })
    .then(r => r.text())
    .then(html => {
      document.getElementById('rightSidebar').innerHTML = html;
    });

  fetch('/includes/footer.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
      document.getElementById('year').textContent = new Date().getFullYear();
    });
</script>
